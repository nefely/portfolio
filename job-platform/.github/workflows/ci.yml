name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Дані вакансій/партнерів фетчаться client-side (useAsync у браузері),
      # тож справжні Supabase-креденшели для самого білда не потрібні —
      # generateStaticParams (app/[locale]/layout.tsx) працює лише з
      # локалями (uk/en/pl), без мережевих запитів. Плейсхолдери нижче лише
      # задовольняють process.env.X! (non-null assertion) у
      # lib/supabase/client.ts/server.ts під час компіляції.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
