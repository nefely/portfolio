<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="70" y1="30" x2="690" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="accent" x1="250" y1="125" x2="530" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity=".08"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .vv-lock-glow { animation: vv-glow 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes vv-glow {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.07); opacity: .85; }
      }

      .vv-float-a, .vv-float-b { animation: vv-float 5s ease-in-out infinite; }
      .vv-float-b { animation-delay: 1.6s; }
      @keyframes vv-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      /* Цей блок уже має статичний transform="translate(87 300)" —
         анімація transform НЕ додається до нього, а замінює його повністю,
         тож базовий зсув треба "запекти" прямо в keyframes, інакше блок
         стрибає у (0,0). */
      .vv-float-c { animation: vv-float-c 5s ease-in-out infinite; animation-delay: .8s; }
      @keyframes vv-float-c {
        0%, 100% { transform: translate(87px, 300px); }
        50% { transform: translate(87px, 292px); }
      }

      .vv-dash { animation: vv-dash 2.5s linear infinite; }
      @keyframes vv-dash {
        to { stroke-dashoffset: -22; }
      }

      .vv-bar-a { animation: vv-bar-fill-a 3.2s ease-in-out infinite; }
      @keyframes vv-bar-fill-a {
        0% { width: 0px; }
        70%, 100% { width: 126px; }
      }
      .vv-bar-b { animation: vv-bar-fill-b 3.2s ease-in-out infinite; animation-delay: .4s; }
      @keyframes vv-bar-fill-b {
        0% { width: 0px; }
        70%, 100% { width: 131px; }
      }
    }
  </style>

  <rect width="760" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="600" cy="95" r="82" fill="#0EA5E9" opacity=".05"/>
  <circle cx="118" cy="420" r="105" fill="#2563EB" opacity=".04"/>

  <g filter="url(#shadow)">
    <rect x="190" y="50" width="380" height="420" rx="30" fill="url(#card)" stroke="#E5E7EB"/>
  </g>

  <!-- Анімовані групи (vv-float-*, vv-lock-glow) мають CSS transform, який
       ЗАМІНЮЄ атрибут transform, тож масштаб/позиція — на зовнішній обгортці. -->
  <g transform="translate(30 90) scale(1.3) translate(-54 -118)">
  <g filter="url(#shadow)" class="vv-float-a">
    <rect x="54" y="118" width="184" height="122" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="94" cy="159" r="22" fill="#E5E7EB"/>
    <circle cx="94" cy="152" r="8" fill="#9CA3AF"/>
    <path d="M79 176C81.5 165 88.5 161 94 161C99.5 161 106.5 165 109 176" fill="#9CA3AF"/>
    <rect x="128" y="143" width="76" height="9" rx="4.5" fill="#374151"/>
    <rect x="128" y="161" width="57" height="7" rx="3.5" fill="#9CA3AF"/>
    <rect x="78" y="202" width="126" height="10" rx="5" fill="#E5E7EB"/>
    <rect class="vv-bar-a" x="78" y="202" width="84" height="10" rx="5" fill="#0EA5E9"/>
  </g>
  </g>

  <g transform="translate(491 270) scale(1.3) translate(-522 -282)">
  <g filter="url(#shadow)" class="vv-float-b">
    <rect x="522" y="282" width="184" height="122" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="548" y="310" width="44" height="44" rx="10" fill="#E0F2FE"/>
    <!-- Clean employer / company icon -->
    <path d="M557 329L570 318L583 329" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M560.5 326.5V343.5H579.5V326.5" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M567.5 343.5V335H572.5V343.5" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="609" y="315" width="70" height="9" rx="4.5" fill="#374151"/>
    <rect x="609" y="333" width="52" height="7" rx="3.5" fill="#9CA3AF"/>
    <rect x="548" y="370" width="131" height="9" rx="4.5" fill="#E5E7EB"/>
    <rect class="vv-bar-b" x="548" y="370" width="98" height="9" rx="4.5" fill="#2563EB"/>
  </g>
  </g>

  <!-- Connections: card ports → edge of the lock circle (center 385,244, r ≈61
       після scale 1.6). Drawn before the lock so the circle overlaps the line
       ends while it pulses. -->
  <g fill="none" stroke-linecap="round">
    <path class="vv-dash" d="M269 169 C298 171 318 190 337 214" stroke="#0EA5E9" stroke-width="2.6" stroke-dasharray="6 7" opacity=".72"/>
    <circle cx="269" cy="169" r="5" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2.4"/>

    <path class="vv-dash" d="M430 282 C452 300 470 322 491 330" stroke="#2563EB" stroke-width="2.6" stroke-dasharray="6 7" opacity=".72"/>
    <circle cx="491" cy="330" r="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.4"/>
  </g>

  <g transform="translate(385 244) scale(1.6) translate(-385 -244)">
  <g filter="url(#glow)" class="vv-lock-glow">
    <circle cx="385" cy="244" r="38" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
    <rect x="366" y="231" width="38" height="28" rx="5" fill="url(#accent)"/>
    <path d="M375 231V226C375 221.6 378.6 218 383 218H387C391.4 218 395 221.6 395 226V231" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
    <path d="M366 243H404" stroke="#0B121C" stroke-width="2" opacity=".5"/>
    <rect x="381.5" y="240" width="7" height="6" rx="2" fill="#0B121C"/>
  </g>
  </g>

  <g transform="translate(40 300) scale(1.3) translate(-87 -300)">
  <g transform="translate(87 300)" class="vv-float-c">
    <rect width="120" height="62" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="28" cy="31" r="10" fill="#0EA5E9" opacity=".2"/>
    <path d="M22 31L27 36L35 26" stroke="#0EA5E9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="20" width="49" height="7" rx="3.5" fill="#374151"/>
    <rect x="48" y="34" width="36" height="6" rx="3" fill="#9CA3AF"/>
  </g>
  </g>
</svg>
