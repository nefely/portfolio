<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="70" y1="30" x2="690" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E0E0E"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="accent" x1="250" y1="125" x2="530" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1F1F1F"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .vv-lock-glow { animation: vv-glow 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes vv-glow {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.07); opacity: .85; }
      }

      .vv-node { animation: vv-node-pulse 2.4s ease-in-out infinite; }
      @keyframes vv-node-pulse {
        0%, 100% { opacity: .45; }
        50% { opacity: 1; }
      }
      .vv-node:nth-child(1) { animation-delay: 0s; }
      .vv-node:nth-child(2) { animation-delay: .25s; }
      .vv-node:nth-child(3) { animation-delay: .5s; }
      .vv-node:nth-child(4) { animation-delay: .75s; }
      .vv-node:nth-child(5) { animation-delay: 1s; }
      .vv-node:nth-child(6) { animation-delay: 1.25s; }
      .vv-node:nth-child(7) { animation-delay: 1.5s; }

      .vv-float-a, .vv-float-b { animation: vv-float 5s ease-in-out infinite; }
      .vv-float-b { animation-delay: 1.6s; }
      @keyframes vv-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      /* Цей блок уже має статичний transform="translate(87 300)" —
         анімація transform НЕ додається до нього, а замінює його повністю,
         тож базовий зсув треба "запекти" прямо в keyframes, інакше блок
         стрибає у (0,0). */
      .vv-float-c { animation: vv-float-c 5s ease-in-out infinite; animation-delay: .8s; }
      @keyframes vv-float-c {
        0%, 100% { transform: translate(87px, 300px); }
        50% { transform: translate(87px, 292px); }
      }

      .vv-dash { animation: vv-dash 2.5s linear infinite; }
      @keyframes vv-dash {
        to { stroke-dashoffset: -22; }
      }

      .vv-bar-a { animation: vv-bar-fill-a 3.2s ease-in-out infinite; }
      @keyframes vv-bar-fill-a {
        0% { width: 0px; }
        70%, 100% { width: 126px; }
      }
      .vv-bar-b { animation: vv-bar-fill-b 3.2s ease-in-out infinite; animation-delay: .4s; }
      @keyframes vv-bar-fill-b {
        0% { width: 0px; }
        70%, 100% { width: 131px; }
      }
    }
  </style>

  <rect width="760" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="600" cy="95" r="82" fill="#2DD4BF" opacity=".05"/>
  <circle cx="118" cy="420" r="105" fill="#22C55E" opacity=".04"/>

  <g filter="url(#shadow)">
    <rect x="208" y="70" width="344" height="380" rx="28" fill="url(#card)" stroke="#2E2E2E"/>
  </g>

  <path d="M351 142 C332 140 319 151 315 168 C306 171 300 181 304 190 C289 196 287 210 297 221 C286 229 285 243 294 251 C288 263 294 276 307 279 C301 294 310 305 324 307 C323 320 335 330 348 327 C354 340 369 343 379 335 C390 349 408 348 416 334 C429 341 445 333 447 319 C462 320 473 308 469 294 C483 286 484 269 472 260 C480 247 475 231 461 226 C463 210 452 199 438 200 C437 184 425 174 411 178 C405 160 388 153 374 162 C368 149 360 143 351 142Z" fill="#152927" stroke="#2DD4BF" stroke-opacity=".7" stroke-width="2"/>

  <g stroke="#2DD4BF" stroke-width="2.2" stroke-linecap="round" opacity=".75">
    <path d="M345 204 C375 175 414 175 439 205"/>
    <path d="M320 242 C358 230 402 242 433 275"/>
    <path d="M351 300 C378 278 413 278 447 302"/>
    <!-- exact node-to-node connection: begins in the center of the upper-left node -->
    <path d="M345 204 C332 236 338 281 365 313"/>
    <!-- exact node-to-node connection: begins/ends in node centers -->
    <path d="M439 205 C433 236 432 270 447 302"/>
  </g>

  <g fill="#2DD4BF">
    <circle class="vv-node" cx="345" cy="204" r="6"/><circle class="vv-node" cx="439" cy="205" r="6"/><circle class="vv-node" cx="320" cy="242" r="6"/><circle class="vv-node" cx="433" cy="275" r="6"/><circle class="vv-node" cx="351" cy="300" r="6"/><circle class="vv-node" cx="447" cy="302" r="6"/><circle class="vv-node" cx="365" cy="313" r="6"/>
  </g>
  <g fill="#D7FFF8">
    <circle class="vv-node" cx="345" cy="204" r="2.2"/><circle class="vv-node" cx="439" cy="205" r="2.2"/><circle class="vv-node" cx="320" cy="242" r="2.2"/><circle class="vv-node" cx="433" cy="275" r="2.2"/><circle class="vv-node" cx="351" cy="300" r="2.2"/><circle class="vv-node" cx="447" cy="302" r="2.2"/><circle class="vv-node" cx="365" cy="313" r="2.2"/>
  </g>

  <g filter="url(#glow)" class="vv-lock-glow">
    <circle cx="385" cy="244" r="38" fill="#0E1817" stroke="#2DD4BF" stroke-width="2"/>
    <rect x="366" y="231" width="38" height="28" rx="5" fill="url(#accent)"/>
    <path d="M375 231V226C375 221.6 378.6 218 383 218H387C391.4 218 395 221.6 395 226V231" stroke="#B7FFF2" stroke-width="3" stroke-linecap="round"/>
    <path d="M366 243H404" stroke="#0D1413" stroke-width="2" opacity=".5"/>
    <rect x="381.5" y="240" width="7" height="6" rx="2" fill="#0D1413"/>
  </g>

  <g filter="url(#shadow)" class="vv-float-a">
    <rect x="54" y="118" width="184" height="122" rx="20" fill="#171717" stroke="#2E2E2E"/>
    <circle cx="94" cy="159" r="22" fill="#262626"/>
    <circle cx="94" cy="152" r="8" fill="#A3A3A3"/>
    <path d="M79 176C81.5 165 88.5 161 94 161C99.5 161 106.5 165 109 176" fill="#A3A3A3"/>
    <rect x="128" y="143" width="76" height="9" rx="4.5" fill="#E5E5E5"/>
    <rect x="128" y="161" width="57" height="7" rx="3.5" fill="#737373"/>
    <rect x="78" y="202" width="126" height="10" rx="5" fill="#262626"/>
    <rect class="vv-bar-a" x="78" y="202" width="84" height="10" rx="5" fill="#2DD4BF"/>
  </g>

  <g filter="url(#shadow)" class="vv-float-b">
    <rect x="522" y="282" width="184" height="122" rx="20" fill="#171717" stroke="#2E2E2E"/>
    <rect x="548" y="310" width="44" height="44" rx="10" fill="#1A3330"/>
    <!-- Clean employer / company icon -->
    <path d="M557 329L570 318L583 329" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M560.5 326.5V343.5H579.5V326.5" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M567.5 343.5V335H572.5V343.5" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="609" y="315" width="70" height="9" rx="4.5" fill="#E5E5E5"/>
    <rect x="609" y="333" width="52" height="7" rx="3.5" fill="#737373"/>
    <rect x="548" y="370" width="131" height="9" rx="4.5" fill="#262626"/>
    <rect class="vv-bar-b" x="548" y="370" width="98" height="9" rx="4.5" fill="#22C55E"/>
  </g>

  <!-- External connections: clean curved routes with explicit ports -->
  <g fill="none" stroke-linecap="round">
    <path class="vv-dash" d="M238 179 C261 179 279 184 299 198" stroke="#2DD4BF" stroke-width="2.2" stroke-dasharray="5 6" opacity=".72"/>
    <circle cx="238" cy="179" r="4" fill="#141414" stroke="#2DD4BF" stroke-width="2"/>
    <circle cx="299" cy="198" r="4" fill="#141414" stroke="#2DD4BF" stroke-width="2"/>

    <path class="vv-dash" d="M472 300 C492 312 506 321 522 328" stroke="#22C55E" stroke-width="2.2" stroke-dasharray="5 6" opacity=".72"/>
    <circle cx="472" cy="300" r="4" fill="#141414" stroke="#22C55E" stroke-width="2"/>
    <circle cx="522" cy="328" r="4" fill="#141414" stroke="#22C55E" stroke-width="2"/>
  </g>

  <g transform="translate(87 300)" class="vv-float-c">
    <rect width="120" height="62" rx="16" fill="#151515" stroke="#2E2E2E"/>
    <circle cx="28" cy="31" r="10" fill="#2DD4BF" opacity=".2"/>
    <path d="M22 31L27 36L35 26" stroke="#2DD4BF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="20" width="49" height="7" rx="3.5" fill="#E5E5E5"/>
    <rect x="48" y="34" width="36" height="6" rx="3" fill="#737373"/>
  </g>
</svg>
